<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark complete</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;display:flex;justify-content:center;background:#C9CFD6;padding:24px 0}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input{font:inherit}
button{cursor:pointer}
a{color:#1D3A5F}a:hover{color:#0F1B2A}
</style>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #5A6472; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #0F1B2A">

<div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #F4F5F2; border-radius: 18px 18px 0 0; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C9CFD6"></div>
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="04-item-detail.html" style="font-size: 15px; text-decoration: none; padding: 8px 0">Cancel</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 600">Log completion</h1>
<span style="width: 50px"></span>
</div>
<div style="font-size: 20px; font-weight: 700; margin-top: -4px">Oil &amp; filter change</div>

<section style="background: #fff; border: 1px solid #DDE1E6; border-radius: 14px; padding: 0 14px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0">
<label for="d" style="font-size: 15px">Date done</label>
<input id="d" value="Sep 30, 2026" style="width: 140px; text-align: right; border: none; font-size: 15px; font-weight: 600; color: #0F1B2A; background: none">
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #EEF0F2">
<label for="t" style="font-size: 15px">Tach<span style="display: block; font-size: 12px; color: #4A5566">Latest reading prefilled</span></label>
<input id="t" class="m" value="1,270.4" style="width: 120px; text-align: right; border: none; font-size: 16px; font-weight: 600; color: #0F1B2A; background: none">
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #EEF0F2">
<label for="h" style="font-size: 15px">Hobbs</label>
<input id="h" class="m" value="1,402.8" style="width: 120px; text-align: right; border: none; font-size: 16px; font-weight: 600; color: #0F1B2A; background: none">
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #EEF0F2">
<label for="p" style="font-size: 15px">Performed by</label>
<input id="p" placeholder="Mechanic or shop" style="width: 170px; text-align: right; border: none; font-size: 15px; color: #0F1B2A; background: none">
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #EEF0F2">
<label for="c" style="font-size: 15px">A&amp;P / IA cert. no.</label>
<input id="c" placeholder="Optional" style="width: 150px; text-align: right; border: none; font-size: 15px; color: #0F1B2A; background: none">
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; border: 1.5px dashed #9AA4B2; border-radius: 12px; background: #fff; color: #1D3A5F; font-size: 14px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg>Attach invoice</button>
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; border: 1.5px dashed #9AA4B2; border-radius: 12px; background: #fff; color: #1D3A5F; font-size: 14px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M4 17h15"/></svg>Logbook entry</button>
</div>

<div>
<div style="font-size: 12px; font-weight: 600; color: #4A5566; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px">Next interval starts from</div>
<div role="group" aria-label="Interval anchor" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E4E7EB; border-radius: 10px; padding: 3px">
<button type="button" style="border: none; background: #fff; border-radius: 8px; padding: 9px 0; font-size: 14px; font-weight: 600; color: #0F1B2A">This completion</button>
<button type="button" style="border: none; background: none; padding: 9px 0; font-size: 14px; color: #4A5566">Previous due point</button>
</div>
</div>

<div style="background: #E6F2EA; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; color: #1E5A38">Resets to <strong class="m">1,320.4 tach</strong> or <strong class="m">Jan 30, 2027</strong>, whichever first.</div>

<button type="button" style="height: 52px; border: none; border-radius: 12px; background: #1D3A5F; color: #fff; font-size: 16px; font-weight: 600">Save &amp; reset counter</button>
</div>
</div>
</body>
</html>
