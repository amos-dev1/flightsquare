# Local development database.
#
# Three roles, created at initdb by db/init/01-create-roles.sh:
#   flightsquare_owner  DDL / migrations. Owns every object.
#   app_role            The application. No BYPASSRLS, no superuser, owns nothing.
#   admin_role          Control plane (CLAUDE.md §7). No BYPASSRLS either — §1.2
#                       is absolute and has no admin exception.
#
# Postgres 18 is required: uuidv7() is built in there, and §6 wants time-sortable
# keys with no sequence leakage across tenants.

services:
  db:
    image: postgres:18-alpine
    container_name: flightsquare-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${FS_DB_NAME:-flightsquare}
      PGDATA: /var/lib/postgresql/data/pgdata
      FS_OWNER_PASSWORD: ${FS_OWNER_PASSWORD:-owner_dev_password}
      FS_APP_PASSWORD: ${FS_APP_PASSWORD:-app_dev_password}
      FS_ADMIN_PASSWORD: ${FS_ADMIN_PASSWORD:-admin_dev_password}
      FS_MAIL_PASSWORD: ${FS_MAIL_PASSWORD:-mail_dev_password}
      FS_SCHEDULER_PASSWORD: ${FS_SCHEDULER_PASSWORD:-scheduler_dev_password}
    ports:
      # Bound to loopback: the dev database is not reachable from the network.
      - "127.0.0.1:${FS_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Everything else (roles.sql, migrations, tests) is read from here.
      - ./db:/opt/flightsquare/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${FS_DB_NAME:-flightsquare}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Object storage, for §3.8's attachments.
  #
  # MinIO speaks the S3 API, so the application talks to one interface in
  # development and in production and §9's deferred hosting decision stays
  # deferred: pointing at real S3 is a change of endpoint and credentials,
  # not a change of code. The alternative — writing files to a directory —
  # would have been a code path that could not survive a deployment.
  storage:
    # Chainguard's build rather than minio/minio: Docker Hub's `latest` for
    # that repository is no longer pullable without credentials, and a dev
    # stack that needs a docker login is a dev stack nobody can start.
    # Pinned by digest, like postgres is pinned by tag.
    image: chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    container_name: flightsquare-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FS_STORAGE_KEY:-flightsquare}
      MINIO_ROOT_PASSWORD: ${FS_STORAGE_SECRET:-storage_dev_password}
    ports:
      # Loopback, like the database: local development is not a network
      # service. 9000 is the S3 API, 9001 the console.
      - "127.0.0.1:${FS_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${FS_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage:/data
    healthcheck:
      # The image carries no shell tools, so the API's own readiness check
      # does this properly; compose just needs the port answering.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
  storage:
