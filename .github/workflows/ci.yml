name: CI

on:
  pull_request:
  # Callable, so the deploy workflow gates on these same tests rather than
  # repeating them or racing them.
  #
  # No `push: [main]` trigger any more, and not an oversight: deploy-dev.yml
  # runs on every push to main and calls this, so main is still tested on every
  # push — once. Keeping both would have run the suite twice and, worse, put
  # the two runs in the same concurrency group below, where they would cancel
  # each other and leave a deploy half-done.
  workflow_call:

# Cancel an in-flight run when you push again to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 18, not 16. `db/migrations/0001_foundation.sql` opens with
        # `RAISE EXCEPTION 'PostgreSQL 18+ required for uuidv7()'` — every
        # primary key in the schema is `DEFAULT uuidv7()`, a PostgreSQL 18
        # built-in — so on 16 the first migration stops dead and nothing after
        # it can run. This matches the RDS instance and local Docker.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flightsquare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Migrations run as the owner role, which is also what creates
      # app_role and admin_role. See CLAUDE.md §9.
      #
      # `DATABASE_URL` being set is what puts the scripts in "direct" mode —
      # talking to a database over the network rather than through
      # `docker compose exec`. That mode creates the roles too, and takes their
      # passwords from the same secret-shaped variables the deployed task is
      # given, so the passwords below are the ones the Test step then connects
      # with. They are the role passwords for a throwaway service container
      # that exists for ninety seconds and is reachable only from this job.
      - name: Migrate
        run: npm run migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/flightsquare_test
          APP_ROLE_SECRET: '{"username":"app_role","password":"app_role"}'
          ADMIN_ROLE_SECRET: '{"username":"admin_role","password":"admin_role"}'
          # mail_role and scheduler_role too, because the API suite connects as
          # both — the outbox worker and the sweep each have their own role.
          # Without these, direct mode gives them deliberately unknowable
          # passwords and those tests fail on authentication.
          MAIL_ROLE_SECRET: '{"username":"mail_role","password":"mail_role"}'
          SCHEDULER_ROLE_SECRET: '{"username":"scheduler_role","password":"scheduler_role"}'

      # Two suites, two connections, because they need opposite things and a
      # single DATABASE_URL cannot be both.
      #
      # db/tests drives psql as flightsquare_owner, postgres and app_role in
      # turn — it is checking that a policy denies, which means being able to
      # ask as more than one role. In "direct" mode the login comes from
      # DATABASE_URL, so that login has to be one that may SET ROLE. As
      # app_role it cannot, and the suite stops on `permission denied to set
      # role "flightsquare_owner"`.
      - name: Database isolation tests
        run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/flightsquare_test

      # Object storage, for the attachments and aircraft-documents suites.
      #
      # A step rather than a `services:` entry because MinIO needs a command
      # (`server /data`) and service containers have no way to set one — they
      # take an image, env, ports and options and nothing else. Same image
      # digest and same credentials as docker-compose.yml, so the tests find
      # it on the endpoint their defaults already point at and need no
      # configuration here.
      #
      # The bucket is not created: the API does that on boot (`ensureBucket`).
      - name: Object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=flightsquare \
            -e MINIO_ROOT_PASSWORD=storage_dev_password \
            chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9 \
            server /data
          for _ in $(seq 1 30); do
            curl -sf -m 2 http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
          curl -sf -m 5 http://127.0.0.1:9000/minio/health/live \
            || { echo "object storage did not come up"; docker logs minio; exit 1; }

      # `boundaries.test.ts` asserts that nothing in the built API still
      # references @flightsquare/shared at runtime — it reads api/dist, so
      # there has to be one. Building here also means a broken build fails
      # before the deploy workflow spends ten minutes discovering it.
      - name: Build the API
        run: npm run build -w api

      # The API suite is the opposite case to the one above, deliberately: it
      # connects as app_role, the restricted role with no BYPASSRLS. Running it
      # as the owner would make every isolation test pass for the wrong reason
      # (CLAUDE.md §1.2, §6.1).
      #
      # These are NOT DATABASE_URL. Nothing in api/ reads that — `config.ts`
      # takes a host, a database and per-role credentials, and the roles are
      # separate on purpose: the API cannot read the outbox, and the mail
      # worker cannot read anything else. The passwords match what the Migrate
      # step above created the roles with.
      - name: API tests
        run: npx vitest run
        env:
          FS_DB_HOST: localhost
          FS_DB_NAME: flightsquare_test
          FS_APP_PASSWORD: app_role
          FS_MAIL_PASSWORD: mail_role
          FS_SCHEDULER_PASSWORD: scheduler_role
